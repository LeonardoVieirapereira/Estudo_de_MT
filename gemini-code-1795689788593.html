<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livro Interativo de Estatística — Teoria, Ilustrações e Exercícios</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #fdfbf7;
            --page-bg: #f1ece1;
            --ink: #1e293b;
            --ink-soft: #475569;
            --navy: #1e3a8a;
            --gold: #b45309;
            --emerald: #047857;
            --crimson: #b91c1c;
            --border: #dcd5c7;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; scroll-behavior: smooth; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--page-bg);
            color: var(--ink);
            display: flex;
            min-height: 100vh;
        }

        /* Sumário Lateral (Estilo Índice de Livro) */
        aside {
            width: 300px;
            background: #172554;
            color: #f8fafc;
            height: 100vh;
            position: fixed;
            overflow-y: auto;
            padding: 1.5rem 1.2rem;
            border-right: 4px solid var(--gold);
        }
        aside h1 {
            font-family: 'Crimson Pro', serif;
            font-size: 1.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding-bottom: 0.75rem;
            margin-bottom: 1rem;
        }
        aside small { color: #93c5fd; display: block; font-family: 'Inter', sans-serif; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; }
        aside nav a {
            display: block;
            color: #cbd5e1;
            text-decoration: none;
            font-size: 0.83rem;
            padding: 0.45rem 0.6rem;
            border-radius: 6px;
            margin-bottom: 0.2rem;
            transition: 0.2s;
        }
        aside nav a:hover { background: rgba(255,255,255,0.12); color: #fff; }
        aside nav b { color: #fbbf24; font-family: 'JetBrains Mono', monospace; margin-right: 4px; }

        /* Página do Livro */
        main {
            margin-left: 300px;
            flex: 1;
            padding: 2.5rem 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .book-sheet {
            background: var(--paper);
            max-width: 860px;
            width: 100%;
            padding: 3.5rem 4rem;
            border-radius: 4px;
            box-shadow: 0 12px 35px rgba(30, 41, 59, 0.12), 0 0 0 1px var(--border);
        }
        .book-cover {
            text-align: center;
            border-bottom: 2px double var(--navy);
            padding-bottom: 2rem;
            margin-bottom: 3rem;
        }
        .book-cover span { color: var(--gold); font-weight: 700; letter-spacing: 2px; font-size: 0.8rem; text-transform: uppercase; }
        .book-cover h2 { font-family: 'Crimson Pro', serif; font-size: 2.6rem; color: var(--navy); margin: 0.5rem 0; }
        .book-cover p { font-family: 'Crimson Pro', serif; font-size: 1.2rem; font-style: italic; color: var(--ink-soft); }

        /* Capítulos */
        .chapter {
            margin-bottom: 3.5rem;
            padding-bottom: 2.5rem;
            border-bottom: 1px solid var(--border);
        }
        .chapter-num {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--gold);
            font-weight: 600;
            text-transform: uppercase;
        }
        .chapter h3 {
            font-family: 'Crimson Pro', serif;
            font-size: 1.85rem;
            color: var(--navy);
            margin: 0.25rem 0 1rem;
        }
        .chapter p {
            font-family: 'Crimson Pro', serif;
            font-size: 1.2rem;
            line-height: 1.75;
            margin-bottom: 1rem;
            text-align: justify;
        }
        .formula {
            background: #f4f1ea;
            border-left: 4px solid var(--navy);
            padding: 0.9rem 1.2rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.95rem;
            color: var(--navy);
            margin: 1.2rem 0;
            border-radius: 0 6px 6px 0;
        }

        /* Quadro Ilustrativo / Passo a Passo Visual */
        .figure-box {
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.25rem;
            margin: 1.5rem 0;
            text-align: center;
        }
        .figure-box figcaption {
            font-size: 0.85rem;
            color: var(--ink-soft);
            margin-top: 0.75rem;
            font-style: italic;
        }

        /* Caixa de Exercício Interativo */
        .exercise-box {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-top: 4px solid var(--gold);
            border-radius: 8px;
            padding: 1.5rem;
            margin-top: 1.5rem;
        }
        .exercise-title {
            font-weight: 700;
            color: var(--gold);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.5rem;
        }
        .exercise-q { font-weight: 600; margin-bottom: 1rem; font-size: 1rem; }
        .options { display: flex; flex-direction: column; gap: 0.5rem; }
        .opt-btn {
            text-align: left;
            background: #fff;
            border: 1px solid #cbd5e1;
            padding: 0.7rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: 0.2s;
        }
        .opt-btn:hover { border-color: var(--navy); background: #eff6ff; }
        .opt-btn.correct { background: #ecfdf5; border-color: var(--emerald); color: var(--emerald); font-weight: 600; }
        .opt-btn.wrong { background: #fef2f2; border-color: var(--crimson); color: var(--crimson); }

        /* Explicação Detalhada Pós-Resposta */
        .feedback {
            display: none;
            margin-top: 1rem;
            padding: 1.1rem;
            border-radius: 6px;
            font-size: 0.95rem;
            line-height: 1.6;
        }
        .feedback.show { display: block; animation: fadeIn 0.3s ease; }
        .feedback.ok { background: #ecfdf5; border-left: 4px solid var(--emerald); color: #064e3b; }
        .feedback.err { background: #fef2f2; border-left: 4px solid var(--crimson); color: #7f1d1d; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 900px) {
            aside { display: none; }
            main { margin-left: 0; padding: 1rem; }
            .book-sheet { padding: 1.75rem 1.25rem; }
        }
    </style>
</head>
<body>

    <aside>
        <h1><small>Compêndio de Matemática</small>Estatística Aplicada</h1>
        <nav id="toc"></nav>
    </aside>

    <main>
        <article class="book-sheet">
            <header class="book-cover">
                <span>Edição Didática Interativa</span>
                <h2>Fundamentos de Estatística</h2>
                <p>Teoria ilustrada, demonstrações visuais passo a passo e exercícios resolvidos</p>
            </header>
            <div id="book-content"></div>
        </article>
    </main>

    <script>
        // Banco de Dados do Livro (Estrutura limpa sem repetição de HTML)
        const capitulos = [
            {

                formula: "Coleta → Organização → Análise → Tomada de Decisão",
                svg: `<svg width="100%" height="110" viewBox="0 0 600 110">

                        <path d="M385 55 L420 55" stroke="#047857" stroke-width="2"/>
                        <rect x="430" y="25" width="150" height="60" rx="8" fill="#d1fae5" stroke="#047857" stroke-width="2"/>

                        <text x="505" y="70" text-anchor="middle" fill="#475569" font-size="11">Previsões & Decisões</text>
                      </svg>`,
                legenda: "Figura 1.1 — Fluxo do método estatístico.",
                pergunta: "Um instituto calcula a média de notas apenas dos alunos da turma 3ºA para descrever o desempenho daquela sala. Qual ramo da estatística está sendo usado?",

                correta: 1,

            },
            {
                titulo: "Pesquisa estatística",
                texto: "Uma pesquisa estatística pode ser <b>Censitária</b> (investiga 100% dos elementos, como o Censo do IBGE) ou <b>Amostral</b> (investiga apenas uma parcela representativa por questões de custo e tempo).",
                formula: "Censo = 100% do Universo  |  Amostragem = Parcela Representativa",
                svg: "",
                pergunta: "Uma fábrica de lâmpadas precisa testar a duração (vida útil até queimar) de um lote de 50.000 unidades. Qual tipo de pesquisa deve ser feita?",

                correta: 1,
                explicacao: "<b>Passo a passo:</b> Se a fábrica testasse todas as lâmpadas até queimarem (Censo), não sobraria nenhuma para vender! Por isso, testes destrutivos exigem obrigatoriamente uma <b>pesquisa amostral</b>."
            },
            {
                titulo: "População e amostra",
                texto: "<b>População (N)</b> é o conjunto completo de elementos com uma característica em comum. <b>Amostra (n)</b> é um subconjunto finito extraído da população para representá-la.",
                formula: "n ⊂ N   (A amostra n está contida na população N)",
                svg: `<svg width="100%" height="130" viewBox="0 0 500 130">
                        <ellipse cx="180" cy="65" rx="130" ry="52" fill="#eff6ff" stroke="#1e3a8a" stroke-width="2"/>
                        <text x="120" y="55" font-weight="bold" fill="#1e3a8a" font-size="14">POPULAÇÃO (N)</text>
                        <text x="120" y="75" fill="#475569" font-size="12">Todos os eleitores do país</text>
                        <circle cx="380" cy="65" r="42" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>

                        <text x="380" y="78" text-anchor="middle" fill="#475569" font-size="10">2.000 entrevistados</text>
                        <path d="M265 45 Q310 20 345 45" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="4"/>
                      </svg>`,

                pergunta: "Para saber a altura média dos 1.200 estudantes de um colégio, foram medidos 80 alunos sorteados. Quem é a amostra?",

                correta: 1,
                explicacao: "<b>Resolução:</b> Os 1.200 estudantes formam a <b>População (N)</b>. O grupo menor selecionado para medição (os <b>80 alunos</b>) é a <b>Amostra (n)</b>."

            {

            {

            {

                explicacao: "<b>Resolução:</b> Um círculo completo tem 360°. Calculamos 25% de 360°:<br><code>0,25 × 360° = 90°</code> (um quarto do círculo)."

            {
                titulo: "Histograma de frequência",

                        <rect x="240" y="55" width="80" height="60" fill="#60a5fa" stroke="#1e3a8a" stroke-width="2"/>

        // Renderizador Automático do Livro
        const toc = document.getElementById('toc');
        const content = document.getElementById('book-content');

        capitulos.forEach((cap, idx) => {
            const num = String(idx + 1).padStart(2, '0');
            
            // Adiciona ao Sumário
            toc.innerHTML += `<a href="#cap-${idx}"><b>${num}.</b> ${cap.titulo}</a>`;

            // Monta Ilustração se existir
            const figuraHTML = cap.svg ? `
                <figure class="figure-box">
                    ${cap.svg}
                    <figcaption>${cap.legenda}</figcaption>
                </figure>` : '';

            // Monta Opções da Questão
            const opcoesHTML = cap.opcoes.map((opt, oIdx) => 
                `<button class="opt-btn" onclick="responder(${idx}, ${oIdx}, this)">${String.fromCharCode(65 + oIdx)}) ${opt}</button>`
            ).join('');

            // Injeta Capítulo na Página
            content.innerHTML += `
                <section id="cap-${idx}" class="chapter">
                    <span class="chapter-num">Capítulo ${num}</span>
                    <h3>${cap.titulo}</h3>
                    <p>${cap.texto}</p>
                    <div class="formula">${cap.formula}</div>
                    ${figuraHTML}
                    <div class="exercise-box">
                        <div class="exercise-title">✍ Exercício de Fixação</div>
                        <div class="exercise-q">${cap.pergunta}</div>
                        <div class="options" id="opts-${idx}">${opcoesHTML}</div>
                        <div class="feedback" id="fb-${idx}"></div>
                    </div>
                </section>
            `;
        });

        // Função de Correção Interativa
        function responder(capIdx, optIdx, btn) {
            const cap = capitulos[capIdx];
            const container = document.getElementById(`opts-${capIdx}`);
            const fb = document.getElementById(`fb-${capIdx}`);

            // Limpa marcações anteriores
            container.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('correct', 'wrong'));

            if (optIdx === cap.correta) {
                btn.classList.add('correct');
                fb.className = 'feedback show ok';
                fb.innerHTML = `<strong>✔ Resposta Correta!</strong><br>${cap.explicacao}`;
            } else {
                btn.classList.add('wrong');
                container.children[cap.correta].classList.add('correct');
                fb.className = 'feedback show err';
                fb.innerHTML = `<strong>✘ Não foi dessa vez!</strong> Veja a explicação detalhada:<br>${cap.explicacao}`;
            }
        }
    </script>
